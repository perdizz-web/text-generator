<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Generator Online</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .output-box {
        background: #ffffff;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 20px;
        cursor: pointer;
    }

    .output-title {
        font-weight: bold;
        margin-bottom: 5px;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Text Generator Online 2025</h2>
    <p>Ketik teks di bawah untuk mengubah font otomatis:</p>

    <input type="text" id="inputText" placeholder="Ketik teks di sini..." oninput="generateFonts()">

    <div id="results"></div>
</div>

<script>
const styles = {
    "Italic": {
        normal: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",
        fancy: "𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻"
    },
    "Bold": {
        normal: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",
        fancy: "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳"
    },
    "Double Struck": {
        normal: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",
        fancy: "𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫"
    },
    "Script": {
        normal: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",
        fancy: "𝒜𝐵𝒞𝒟𝐸𝐹𝒢𝐻𝐼𝒥𝒦𝐿𝑀𝒩𝒪𝒫𝒬𝑅𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵𝒶𝒷𝒸𝒹𝑒𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃𝑜𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏"
    }
};

function generateFonts() {
    const text = document.getElementById("inputText").value;
    const resultArea = document.getElementById("results");
    resultArea.innerHTML = "";

    for (let style in styles) {
        let normal = styles[style].normal;
        let fancy = styles[style].fancy;

        let newText = "";

        for (let char of text) {
            let index = normal.indexOf(char);
            newText += index !== -1 ? fancy[index] : char;
        }

        resultArea.innerHTML += `
            <div class="output-box" onclick="copyText('${newText.replace(/'/g, "\\'")}')">
                <div class="output-title">${style}</div>
                ${newText}
            </div>
        `;
    }
}

function copyText(txt) {
    navigator.clipboard.writeText(txt);
    alert("Teks berhasil disalin!");
}
</script>

</body>
</html>
